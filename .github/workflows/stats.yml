name: Weekly stats update

# Tuesday mornings (UK): if every game of the next week is final, pull the ESPN box scores,
# add the week and rebuild the site. Runs twice (06:23 and 07:23 UTC) so it lands around
# 07:23 UK all year; the second run does nothing if the first one worked. Wednesday is a retry.
on:
  schedule:
    - cron: "23 6,7 * * 2"
    - cron: "23 7 * * 3"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to (re)load, e.g. 11. Leave empty for the next finished week."
        required: false

permissions:
  contents: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is a finished week waiting?
        id: check
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then echo "due=true" >> $GITHUB_OUTPUT; echo "week=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT;
          else python3 pipeline/auto.py stats; fi
      - name: Pull box scores and rebuild
        if: steps.check.outputs.due == 'true'
        run: |
          python3 pipeline/fetch_week.py ${{ steps.check.outputs.week }}
          python3 pipeline/build_site.py
          python3 pipeline/auto.py mark stats
      - name: Commit
        if: steps.check.outputs.due == 'true'
        run: |
          git config user.name "nfl-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html pipeline/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Week ${{ steps.check.outputs.week }} stats (ESPN box scores)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
